[package]
name = "rivals-toolkit"
version.workspace = true
description = "Toolkit for Marvel Rivals configuration and mod files"
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rivals_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rivals-core = { path = "../crates/rivals-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
repak.workspace = true
rebnk.workspace = true
retoc.workspace = true
aes.workspace = true
hex.workspace = true
walkdir.workspace = true
winreg = "0.52"
dirs.workspace = true
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress", "util"] }
# UnRAR licence: redistribution is allowed, but the source may not be used to build a
# RAR-compatible archiver. Extraction only.
unrar = "0.5"
blake3.workspace = true
sha2 = "0.10"
rayon.workspace = true
ureq = { version = "3", features = ["json"] }
lewton = "0.10"
sysinfo.workspace = true
