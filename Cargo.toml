[workspace]
members = [
    "src-tauri",
    "crates/rivals-core",
    "crates/rivals-cli",
    "crates/rivals-uasset",
]
resolver = "3"

[workspace.package]
version = "0.15.0"
edition = "2024"
authors = ["Zander"]

# Shared so the app, the core and the CLI can never drift onto different forks.
[workspace.dependencies]
repak = { git = "https://github.com/oZanderr/repak", branch = "master", features = [
    "oodle",
] }
retoc = { git = "https://github.com/oZanderr/retoc", branch = "master" }
rebnk = { git = "https://github.com/oZanderr/rebnk", branch = "master" }
# Same repo and rev retoc already pulls in, so this shares the existing checkout.
usmap = { git = "https://github.com/trumank/jmap.git", rev = "07b0c13e7e3950fc9012b3858a2469b8974300ab" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# A float read back from a dump is the one written, not one off in its last place.
serde_json = { version = "1", features = ["float_roundtrip"] }
aes = "0.8.4"
hex = "0.4"
walkdir = "2"
dirs = "5"
cityhasher = "0.1"
blake3 = "1"
rayon = "1"
# CPU block compression only: the default features pull in wgpu.
block_compression = { version = "0.10", default-features = false, features = [
    "bc15",
    "bc6h",
    "bc7",
] }
png = "0.18"
# High dynamic range textures go out and come back in as OpenEXR, as halves or floats.
exr = "1.74"
half = "2"
# The line diff `mods diff` shows scripts with; the text helpers are not needed.
similar = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
mimalloc = { version = "0.1", default-features = false }
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress", "util"] }
# UnRAR licence: redistribution is allowed, but the source may not be used to build a
# RAR-compatible archiver. Extraction only.
unrar = "0.5"
# Inflates the game's engine log records, which are zlib under AES-CTR.
flate2 = "1"
# Redacts identifying values from shared game logs.
regex = "1"
# Reads a proxy DLL's exports and version resource to tell which ASI loader it is.
pelite = { version = "0.10", default-features = false, features = ["std", "derive_pod"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The game-data tests decode whole game packages, which runs about five times slower unoptimized.
# Only test builds change: `cargo build` and the app's dev builds stay as they are.
[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 3
