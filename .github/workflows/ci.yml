name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: tauri-release
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint:web

      - name: Build
        run: pnpm tauri build --no-bundle

      - name: Format check
        run: pnpm format:check

      - name: Clippy
        run: pnpm lint:rust:strict

      # After the build: tauri-build needs dist/, and the pak tests need Oodle to write a pak.
      - name: Test
        run: cargo test --workspace
        env:
          OODLE_LIB_PATH: ${{ github.workspace }}/src-tauri/resources/oo2core_9_win64.dll
