name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: tauri-release
          save-if: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows executable (no bundles)
        run: pnpm tauri build --no-bundle

      - name: Build CLI
        run: cargo build --release -p rivals-cli

      # The app's zip keeps its name: the in-app updater downloads it by that name. The CLI ships
      # apart, so a CLI copied from an older app zip is never mistaken for the current one.
      - name: Package release zips
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repoRoot = $env:GITHUB_WORKSPACE
          $releaseDir = Join-Path $repoRoot "target/release"
          $stagingRoot = Join-Path $releaseDir "_package"
          $outDir = Join-Path $repoRoot "release-assets"
          $oo2corePath = Join-Path $repoRoot "src-tauri/resources/oo2core_9_win64.dll"

          foreach ($dir in @($stagingRoot, $outDir)) {
            if (Test-Path $dir) {
              Remove-Item $dir -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          # Each zip holds its executable and the Oodle DLL it reads compressed paks with.
          foreach ($package in @(
            @{ Base = "rivals-toolkit-$tag-windows-x64"; Exe = "rivals-toolkit.exe" },
            @{ Base = "rivals-cli-$tag-windows-x64"; Exe = "rivals-cli.exe" }
          )) {
            $exePath = Join-Path $releaseDir $package.Exe
            foreach ($required in @($exePath, $oo2corePath)) {
              if (-not (Test-Path $required)) {
                throw "Required release file not found: $required"
              }
            }

            $stagingDir = Join-Path $stagingRoot $package.Base
            New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

            Copy-Item $exePath (Join-Path $stagingDir $package.Exe) -Force
            Copy-Item $oo2corePath (Join-Path $stagingDir "oo2core_9_win64.dll") -Force

            $zipPath = Join-Path $outDir "$($package.Base).zip"
            Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipPath -CompressionLevel Optimal
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    # The oldest supported runner, so the AppImage runs on every glibc since.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: tauri-release-linux
          save-if: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        run: pnpm tauri build --bundles appimage

      - name: Build CLI
        run: cargo build --release -p rivals-cli

      # The AppImage is named for the in-app updater, which downloads it by that name.
      - name: Package release assets
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          out="release-assets"
          oodle="src-tauri/resources/liboo2corelinux64.so.9"
          rm -rf "$out" && mkdir -p "$out"

          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi
          cp "${appimages[0]}" "$out/rivals-toolkit-$tag-linux-x64.AppImage"
          chmod +x "$out/rivals-toolkit-$tag-linux-x64.AppImage"

          # The CLI reads compressed paks with the Oodle library beside it.
          cli="rivals-cli-$tag-linux-x64"
          mkdir -p "target/release/_package/$cli"
          cp target/release/rivals-cli "$oodle" "target/release/_package/$cli/"
          tar -czf "$out/$cli.tar.gz" -C target/release/_package "$cli"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Validate release tag format
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.].+)?$') {
            throw "Tag '$tag' is invalid. Expected format like v0.1.0 or v0.1.0-beta.1"
          }

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $prevTag = git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1

          if ($prevTag) {
            $changeLines = git --no-pager log --reverse --no-merges --pretty=format:"- %s" "$prevTag..$tag"
          }
          else {
            $changeLines = git --no-pager log --reverse --no-merges --pretty=format:"- %s" "$tag"
          }

          # Drop the automated character_ids.json sync commits; they're noise in release notes.
          $changeLines = $changeLines | Where-Object { $_ -notmatch '^- chore: refresh character_ids\.json$' }

          if (-not $changeLines) {
            $changeLines = "- No changes detected in git log for this release range."
          }

          $changelog = ($changeLines -join "`n")

          $delim = "CHANGELOG_$(New-Guid)"
          "text<<$delim" | Add-Content $env:GITHUB_OUTPUT
          $changelog | Add-Content $env:GITHUB_OUTPUT
          $delim | Add-Content $env:GITHUB_OUTPUT

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release with the packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $downloads = @(
            @{ Name = "rivals-toolkit-$tag-windows-x64.zip"; What = "Desktop app, Windows" },
            @{ Name = "rivals-toolkit-$tag-linux-x64.AppImage"; What = "Desktop app, Linux" },
            @{ Name = "rivals-cli-$tag-windows-x64.zip"; What = "Command-line tool, Windows" },
            @{ Name = "rivals-cli-$tag-linux-x64.tar.gz"; What = "Command-line tool, Linux" }
          )

          $rows = @()
          $uploads = @()
          foreach ($download in $downloads) {
            $assetName = $download.Name
            $assetPath = Join-Path $env:GITHUB_WORKSPACE "release-assets/$assetName"
            if (-not (Test-Path $assetPath)) {
              throw "Expected release asset not found at $assetPath"
            }

            $checksum = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLower()
            $checksumFileName = "$assetName.sha256"
            $checksumFilePath = Join-Path $env:RUNNER_TEMP $checksumFileName
            "$checksum  $assetName" | Set-Content -Path $checksumFilePath -Encoding utf8 -NoNewline

            $downloadUrl = "https://github.com/$repo/releases/download/$tag/$assetName"
            $checksumUrl = "https://github.com/$repo/releases/download/$tag/$checksumFileName"
            $rows += "| $($download.What) | [$assetName]($downloadUrl) | [checksum]($checksumUrl) |"
            $uploads += $assetPath, $checksumFilePath
          }

          $changelog = $env:CHANGELOG

          $lines = @("## Downloads", "", "| | File | |", "| - | ---- | - |") + $rows +
            @("", "## Changelog", "", $changelog)
          ($lines -join "`n") | Set-Content -Path $notesPath -Encoding utf8

          gh release view "$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" `
              --title "Rivals Toolkit $tag" `
              --notes-file "$notesPath" `
              --prerelease=${{ contains(steps.vars.outputs.tag, '-') }}
          }
          else {
            gh release edit "$tag" `
              --title "Rivals Toolkit $tag" `
              --notes-file "$notesPath"
          }

          foreach ($upload in $uploads) {
            gh release upload "$tag" "$upload" --clobber
          }

      - name: Notify Discord on release success
        if: ${{ success() }}
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "DISCORD_RELEASE_WEBHOOK is not configured; skipping Discord notification."
            exit 0
          }

          $tag = "${{ steps.vars.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          $base = "https://github.com/$repo/releases/download/$tag"
          $downloads = @(
            "App: [Windows]($base/rivals-toolkit-$tag-windows-x64.zip), [Linux]($base/rivals-toolkit-$tag-linux-x64.AppImage)",
            "CLI: [Windows]($base/rivals-cli-$tag-windows-x64.zip), [Linux]($base/rivals-cli-$tag-linux-x64.tar.gz)"
          ) -join "`n"

          $changelog = $env:CHANGELOG

          # Discord embed fields are capped at 1024 chars; trim if needed.
          $maxLen = 1000
          if ($changelog.Length -gt $maxLen) {
            $changelog = $changelog.Substring(0, $maxLen) + "`n... [see full changelog]($releaseUrl)"
          }

          $payload = @{
            thread_name = "Rivals Toolkit - $tag"
            content = ""
            embeds = @(
              @{
                color = 5763719
                fields = @(
                  @{ name = "Release"; value = "[View release]($releaseUrl)"; inline = $true },
                  @{ name = "Download"; value = $downloads; inline = $true },
                  @{ name = "Changelog"; value = $changelog; inline = $false }
                )
                timestamp = (Get-Date).ToUniversalTime().ToString("o")
              }
            )
          } | ConvertTo-Json -Depth 8

          Invoke-RestMethod `
            -Uri $env:DISCORD_RELEASE_WEBHOOK `
            -Method Post `
            -ContentType "application/json" `
            -Body $payload
